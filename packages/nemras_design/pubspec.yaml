name: nemras_design
description: Canonical NEMRAS design tokens, typography and themes shared by every NEMRAS surface.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Static faces only. Inter-Variable.ttf and Sora-Variable.ttf are not registered.
# JetBrains Mono Medium and SemiBold are declared at the design weights 500 and
# 600. Their upstream OS/2.usWeightClass values are 436 and 472. That is an
# upstream metadata exception; the font files are not modified.
flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: fonts/sora/Sora-SemiBold.ttf
          weight: 600
        - asset: fonts/sora/Sora-Bold.ttf
          weight: 700
        - asset: fonts/sora/Sora-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: fonts/jetbrains_mono/JetBrainsMono-SemiBold.ttf
          weight: 600
