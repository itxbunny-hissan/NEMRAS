<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>04 Sign Up · NEMRAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app: #F7FAFC;
  --surface-card: #FFFFFF;
  --brand-teal: #0F766E;
  --brand-teal-light: #E8F6F3;
  --text-main: #243746;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;
  --border-light: #E2E8F0;
  --alert-red: #D94848;
  --alert-bg: #FEF2F2;
  --success: #16A34A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 390px;
  height: 844px;
  background: var(--bg-app);
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0 20px 20px;
  overflow: hidden;
  margin: 0 auto;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
}
.nav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
}
.btn-back {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.step-indicator {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--brand-teal);
  background: var(--brand-teal-light);
  padding: 4px 10px;
  border-radius: 9999px;
}
.title-section {
  margin-top: 4px;
  margin-bottom: 12px;
}
.title-section h1 {
  font-family: 'Sora', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.title-section p {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.form-scroll-area {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.form-label {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-main);
}
.form-label span.note {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
}
.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.input-field {
  width: 100%;
  height: 42px;
  background: var(--surface-card);
  border: 1.5px solid var(--border-light);
  border-radius: 10px;
  padding: 0 36px 0 12px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: var(--text-main);
  outline: none;
}
.input-field.mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
}
.input-field.valid {
  border-color: #86EFAC;
  background: #F0FDF4;
}
.input-icon-right {
  position: absolute;
  right: 10px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
}
/* Duplicate account inline warning */
.warn-inline {
  background: var(--alert-bg);
  border: 1px solid #FECACA;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 11px;
  color: #991B1B;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
}
.password-meter {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}
.meter-bars {
  display: flex;
  gap: 4px;
  flex: 1;
}
.bar {
  height: 3px;
  flex: 1;
  border-radius: 9999px;
  background: #E2E8F0;
}
.bar.active { background: var(--brand-teal); }
.meter-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--brand-teal);
  font-weight: 600;
}
.terms-box {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 4px;
  font-size: 11.5px;
  color: var(--text-secondary);
  line-height: 1.4;
}
.terms-box input {
  margin-top: 2px;
  accent-color: var(--brand-teal);
}
.terms-box a {
  color: var(--brand-teal);
  text-decoration: none;
  font-weight: 600;
}
.btn-primary {
  width: 100%;
  height: 46px;
  background: var(--brand-teal);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
  margin-top: 8px;
}
.signin-row {
  text-align: center;
  font-size: 12px;
  color: var(--text-secondary);
}
.signin-row a {
  color: var(--brand-teal);
  font-weight: 600;
  text-decoration: none;
}
</style>
</head>
<body>

<div>
  <div class="status-bar">
    <span>09:41</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-secondary);">5G · 100%</span>
  </div>

  <div class="nav-header">
    <div class="btn-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="step-indicator">STEP 1 OF 3 · CITIZEN</div>
  </div>

  <div class="title-section">
    <h1>Create Emergency Profile</h1>
    <p>Anchor your critical health dossier to your national identity.</p>
  </div>

  <div class="form-scroll-area">
    <div class="form-group">
      <label class="form-label">
        <span>Full Legal Name</span>
        <span class="note">Matches CNIC</span>
      </label>
      <div class="input-wrapper">
        <input type="text" class="input-field valid" value="Kashaf Sajjad">
        <div class="input-icon-right">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        <span>CNIC National Identity</span>
        <span class="note">13 digits without dashes</span>
      </label>
      <div class="input-wrapper">
        <input type="text" class="input-field mono valid" value="36302-1234567-8">
        <div class="input-icon-right">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        <span>Mobile Phone Number</span>
        <span class="note">SMS OTP verification</span>
      </label>
      <div class="input-wrapper">
        <input type="text" class="input-field mono" value="+92 300 1234567">
        <div class="input-icon-right">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">
        <span>Create Security Passcode</span>
        <span class="note">Min 8 chars, 1 number</span>
      </label>
      <div class="input-wrapper">
        <input type="password" class="input-field" value="KashafHealth2026!">
        <div class="input-icon-right">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
      <div class="password-meter">
        <div class="meter-bars">
          <div class="bar active"></div>
          <div class="bar active"></div>
          <div class="bar active"></div>
          <div class="bar"></div>
        </div>
        <span class="meter-label">STRONG</span>
      </div>
    </div>

    <div class="terms-box">
      <input type="checkbox" checked id="terms">
      <label for="terms">
        I authorize NEMRAS to retrieve my verified health records during emergency response as per <a href="#">NDHA Privacy Policy</a> & <a href="#">Terms of Care</a>.
      </label>
    </div>
  </div>

  <button class="btn-primary">
    <span>Continue to Verification</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>
</div>

<div class="signin-row">
  Already registered on NEMRAS? <a href="#">Sign In Here</a>
</div>

</body>
</html>
