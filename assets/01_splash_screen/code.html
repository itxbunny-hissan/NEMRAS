<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>01 Splash Screen · NEMRAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app: #F7FAFC;
  --surface-card: #FFFFFF;
  --brand-teal: #0F766E;
  --brand-teal-subtle: #CCFBF1;
  --brand-teal-light: #E8F6F3;
  --text-main: #243746;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;
  --border-light: #E2E8F0;
  --success: #16A34A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 390px;
  height: 844px;
  background: var(--bg-app);
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0 24px;
  overflow: hidden;
  position: relative;
  margin: 0 auto;
}
/* Subtle clinical background mesh */
.bg-decor {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: 
    radial-gradient(circle at 50% 28%, rgba(15, 118, 110, 0.08) 0%, rgba(247, 250, 252, 0) 65%),
    radial-gradient(circle at 85% 85%, rgba(232, 246, 243, 0.7) 0%, rgba(247, 250, 252, 0) 50%);
  z-index: 0;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
  z-index: 10;
}
.status-icons {
  display: flex;
  gap: 6px;
  align-items: center;
}
.splash-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-top: -30px;
  z-index: 10;
}
.emblem-wrapper {
  position: relative;
  width: 96px;
  height: 96px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.emblem-pulse {
  position: absolute;
  inset: -8px;
  border-radius: 28px;
  background: rgba(15, 118, 110, 0.12);
  border: 1px solid rgba(15, 118, 110, 0.2);
}
.emblem-core {
  width: 96px;
  height: 96px;
  background: linear-gradient(135deg, #0F766E 0%, #115E59 100%);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 24px -6px rgba(15, 118, 110, 0.35);
  position: relative;
  z-index: 2;
}
.emblem-core svg {
  width: 52px;
  height: 52px;
}
.app-name {
  font-family: 'Sora', sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-main);
  margin-bottom: 6px;
}
.app-tagline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--brand-teal);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.mission-text {
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text-secondary);
  max-width: 290px;
}
.boot-card {
  width: 100%;
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: 16px;
  padding: 16px 18px;
  box-shadow: 0 4px 16px -4px rgba(36, 55, 70, 0.05);
  margin-bottom: 24px;
  z-index: 10;
}
.boot-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.boot-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--brand-teal);
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
}
.boot-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}
.progress-track {
  width: 100%;
  height: 6px;
  background: #EDF2F7;
  border-radius: 9999px;
  overflow: hidden;
  margin-bottom: 10px;
}
.progress-fill {
  height: 100%;
  width: 68%;
  background: var(--brand-teal);
  border-radius: 9999px;
}
.boot-caption {
  font-size: 11px;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
}
.footer-note {
  text-align: center;
  padding-bottom: 20px;
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  z-index: 10;
}
</style>
</head>
<body>
<div class="bg-decor"></div>

<div class="status-bar">
  <span>09:41</span>
  <div class="status-icons">
    <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M1 9.5H3.5M5 7H7.5M9 4.5H11.5M13 1H14" stroke="#243746" stroke-width="2" stroke-linecap="round"/></svg>
    <svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M8 2C4.5 2 1.5 4 0 7C1.5 10 4.5 12 8 12C11.5 12 14.5 10 16 7C14.5 4 11.5 2 8 2Z" fill="#243746" fill-opacity="0.2"/><circle cx="8" cy="7" r="2.5" fill="#243746"/></svg>
    <svg width="22" height="11" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="#243746"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="#243746"/><path d="M22 4.5V7.5" stroke="#243746" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
</div>

<div class="splash-content">
  <div class="emblem-wrapper">
    <div class="emblem-pulse"></div>
    <div class="emblem-core">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 3V21M3 12H21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="5" stroke="#FFFFFF" stroke-width="2.2" fill="none"/>
      </svg>
    </div>
  </div>
  <h1 class="app-name">NEMRAS</h1>
  <div class="app-tagline">National Emergency Medical System</div>
  <p class="mission-text">Instant, federated critical health data delivery during life-threatening emergency response.</p>
</div>

<div class="bottom-section">
  <div class="boot-card">
    <div class="boot-header">
      <div class="boot-status">
        <span class="status-dot"></span>
        <span>Secure Enclave Init</span>
      </div>
      <span class="boot-pct">TLS 1.3 · 68%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <div class="boot-caption">
      <span>PK-NDHA Federated Gateway</span>
      <span style="font-family:'JetBrains Mono',monospace;">Multan Node #001</span>
    </div>
  </div>
  
  <div class="footer-note">
    Govt of Pakistan · Health Informatics v1.4
  </div>
</div>

</body>
</html>
