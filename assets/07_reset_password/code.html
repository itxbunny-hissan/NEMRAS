<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>07 Reset Password · NEMRAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app: #F7FAFC;
  --surface-card: #FFFFFF;
  --brand-teal: #0F766E;
  --brand-teal-light: #E8F6F3;
  --text-main: #243746;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;
  --border-light: #E2E8F0;
  --success: #16A34A;
  --alert-red: #D94848;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 390px;
  height: 844px;
  background: var(--bg-app);
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0 20px 24px;
  overflow: hidden;
  margin: 0 auto;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
}
.nav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
}
.btn-back {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.icon-hero {
  width: 60px;
  height: 60px;
  border-radius: 16px;
  background: var(--brand-teal-light);
  color: var(--brand-teal);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 10px 0 16px;
}
.title-section h1 {
  font-family: 'Sora', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.title-section p {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-top: 6px;
  margin-bottom: 20px;
}
.form-group {
  margin-bottom: 14px;
}
.form-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 6px;
}
.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.input-field {
  width: 100%;
  height: 46px;
  background: var(--surface-card);
  border: 1.5px solid var(--border-light);
  border-radius: 12px;
  padding: 0 40px 0 14px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--text-main);
  outline: none;
}
.input-field:focus {
  border-color: var(--brand-teal);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
}
.input-icon-right {
  position: absolute;
  right: 12px;
  color: var(--text-muted);
  cursor: pointer;
}
/* Password rules card */
.rules-card {
  background: #FFFFFF;
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 20px;
}
.rules-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.rule-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.rule-item.valid {
  color: var(--success);
  font-weight: 500;
}
.rule-item.valid svg { stroke: var(--success); }
.btn-primary {
  width: 100%;
  height: 48px;
  background: var(--brand-teal);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
}
.footer-note {
  text-align: center;
  font-size: 12px;
  color: var(--text-secondary);
}
.footer-note a {
  color: var(--brand-teal);
  font-weight: 600;
  text-decoration: none;
}
</style>
</head>
<body>

<div>
  <div class="status-bar">
    <span>09:41</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-secondary);">5G · 100%</span>
  </div>

  <div class="nav-header">
    <div class="btn-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--brand-teal);font-weight:600;">NEW CREDENTIALS</span>
  </div>

  <div class="icon-hero">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-1.5 1.5L16 7l-1.5 1.5M7 17l-4 4v-4h4zm14-11a5.5 5.5 0 00-7.78 0L3 16.22V21h4.78l10.22-10.22a5.5 5.5 0 000-7.78z"/></svg>
  </div>

  <div class="title-section">
    <h1>Reset Password</h1>
    <p>Create a secure new password for your NEMRAS emergency identity.</p>
  </div>

  <div class="form-group">
    <label class="form-label">New Password</label>
    <div class="input-wrapper">
      <input type="password" class="input-field" value="EmergencyNEMRAS2026!">
      <div class="input-icon-right">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Confirm New Password</label>
    <div class="input-wrapper">
      <input type="password" class="input-field" value="EmergencyNEMRAS2026!">
      <div class="input-icon-right">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
    </div>
  </div>

  <!-- Password validation requirements -->
  <div class="rules-card">
    <div class="rules-title">Security Rules Check</div>
    <div class="rule-item valid">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
      <span>Minimum 8 characters (18 entered)</span>
    </div>
    <div class="rule-item valid">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
      <span>Includes at least 1 number & 1 special character</span>
    </div>
    <div class="rule-item valid">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
      <span>Passwords match</span>
    </div>
  </div>

  <button class="btn-primary">
    <span>Save & Sign In</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>
</div>

<div class="footer-note">
  Need help with your profile? <a href="#">Contact NDHA Support</a>
</div>

</body>
</html>
