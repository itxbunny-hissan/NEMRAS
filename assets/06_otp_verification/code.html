<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>06 OTP Verification · NEMRAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app: #F7FAFC;
  --surface-card: #FFFFFF;
  --brand-teal: #0F766E;
  --brand-teal-light: #E8F6F3;
  --text-main: #243746;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;
  --border-light: #E2E8F0;
  --alert-red: #D94848;
  --alert-bg: #FEF2F2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 390px;
  height: 844px;
  background: var(--bg-app);
  font-family: 'Inter', sans-serif;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0 20px 24px;
  overflow: hidden;
  margin: 0 auto;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
}
.nav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
}
.btn-back {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.security-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  color: var(--brand-teal);
  background: var(--brand-teal-light);
  padding: 4px 10px;
  border-radius: 9999px;
}
.icon-hero {
  width: 60px;
  height: 60px;
  border-radius: 16px;
  background: var(--brand-teal-light);
  color: var(--brand-teal);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 10px 0 16px;
}
.title-section h1 {
  font-family: 'Sora', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.title-section p {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-top: 6px;
}
.destination-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #EDF2F7;
  border-radius: 8px;
  padding: 4px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-main);
  margin-top: 6px;
  margin-bottom: 24px;
}
/* 6-digit OTP Box Matrix */
.otp-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.otp-box {
  height: 52px;
  background: var(--surface-card);
  border: 1.5px solid var(--border-light);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-main);
}
.otp-box.filled {
  border-color: var(--brand-teal);
  background: #F0FDF4;
  color: var(--text-main);
}
.otp-box.focused {
  border-color: var(--brand-teal);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
  animation: pulse-border 1.5s infinite;
}
/* Accessible error alert */
.error-banner {
  background: var(--alert-bg);
  border: 1px solid #FECACA;
  border-radius: 10px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: #991B1B;
  margin-bottom: 20px;
}
.resend-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-bottom: 24px;
}
.resend-link {
  color: var(--brand-teal);
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
}
.countdown {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--text-muted);
}
.btn-primary {
  width: 100%;
  height: 48px;
  background: var(--brand-teal);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
}
.keypad-helper {
  background: #FFFFFF;
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--text-secondary);
}
</style>
</head>
<body>

<div>
  <div class="status-bar">
    <span>09:41</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-secondary);">5G · 100%</span>
  </div>

  <div class="nav-header">
    <div class="btn-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="security-chip">SHA-256 OTP</div>
  </div>

  <div class="icon-hero">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01M9 6h6"/></svg>
  </div>

  <div class="title-section">
    <h1>Verify Your Identity</h1>
    <p>A 6-digit emergency access token has been sent to your registered mobile number.</p>
    <div class="destination-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
      +92 300 ••••567
    </div>
  </div>

  <div class="otp-grid">
    <div class="otp-box filled">8</div>
    <div class="otp-box filled">4</div>
    <div class="otp-box filled">2</div>
    <div class="otp-box focused">9</div>
    <div class="otp-box">·</div>
    <div class="otp-box">·</div>
  </div>

  <!-- State Example: Incorrect or Expired code message -->
  <div class="error-banner">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D94848" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <span>Code expires in 01:42. Check your SMS inbox.</span>
  </div>

  <div class="resend-row">
    <span>Didn't receive SMS?</span>
    <span class="countdown">Resend in 00:48</span>
  </div>

  <button class="btn-primary">
    <span>Verify Code</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>
</div>

<div class="keypad-helper">
  <span>Network Gateway: <b>Mobilink / Jazz</b></span>
  <span style="font-family:'JetBrains Mono',monospace;color:#16A34A;">● SMS Route OK</span>
</div>

</body>
</html>
